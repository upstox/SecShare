<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecShare</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle at center, #1f1c2c, #302b63, #0f0c29);
            margin: 0;
            padding: 0;
            color: #fff;
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .processing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background-color: rgba(28, 28, 50, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            max-width: 500px;
            margin: 0 auto;
        }
        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(80, 199, 249, 0.2);
            border-top: 8px solid #50c7f9;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .processing-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #50c7f9;
            text-shadow: 0 0 10px rgba(80, 199, 249, 0.8);
        }
        .status-message {
            font-size: 16px;
            margin-top: 10px;
            line-height: 1.5;
            color: #ddd;
        }
        .error-message {
            color: #ff6f61;
        }
        .success-message {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="processing-container">
        <div class="processing-title">Processing your file...</div>
        <div class="spinner"></div>
        <div id="statusMessage" class="status-message">
            We are uploading and encrypting your file. Please do not close this window.
        </div>
    </div>
</body>
</html>
