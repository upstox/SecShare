<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecShare</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle at center, #1f1c2c, #302b63, #0f0c29);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.6);
            width: 450px;
            text-align: center;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .container:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 50px rgba(80, 199, 249, 0.7);
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: #50c7f9;
            margin-bottom: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(80, 199, 249, 0.8);
        }

        .divider {
            width: 80px;
            height: 3px;
            background-color: #50c7f9;
            margin: 20px auto;
            border-radius: 2px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        p {
            font-size: 18px;
            color: #fff;
            margin: 15px 0;
        }
        .flash-error {
        background-color: rgba(255, 69, 58, 0.95);
        padding: 15px 20px;
        border-radius: 12px;
        margin-bottom: 25px;
        box-shadow: 0px 0px 15px rgba(255, 69, 58, 0.8);
        color: white;
        font-weight: bold;
        font-size: 18px;
        text-align: center;
        animation: flashIn 0.5s ease-out;
        }

        .flash-success {
            background-color: rgba(80, 199, 249, 0.95);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0px 0px 15px rgba(80, 199, 249, 0.8);
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            animation: flashIn 0.5s ease-out;
        }

        @keyframes flashIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .footer {
            width: 100%;
            text-align: center;
            padding: 5px 0; /* reduced vertical padding */
            background: rgba(28, 28, 50, 0.8);
            backdrop-filter: blur(10px);
            color: #aaa;
            font-size: 14px;
        }

        .footer p {
            margin: 0; /* remove default paragraph margins */
        }

        .footer a {
            color: #50c7f9;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>

    <script>
        setTimeout(function() {
            const flashElements = document.querySelectorAll('.flash-success, .flash-error, .flash-message');
            flashElements.forEach(function(el) {
                el.style.transition = 'opacity 1s ease';
                el.style.opacity = '0';
                setTimeout(function() {
                el.remove();
                }, 1000);
            });
        }, 3000);
    </script>
</head>
<body>

    <div class="container">
        <div class="logo">SecShare</div>
        <div class="divider"></div>
    
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    
        <h1>Welcome to SecShare!</h1>
        <p>We are glad to have you here. Enjoy sharing your files!</p>
    </div>
    <!-- <div class="footer" style="text-align: center; padding: 17px 0; background: rgba(28, 28, 50, 0.8); backdrop-filter: blur(10px); color: #aaa; font-size: 14px;">
        <p style="margin: 0;">⚠️ Please share responsibly. Do not upload sensitive or confidential files.</p>
        <p style="margin: 6px 0 0;">Made with ❤️ by the Security Team</p>
    </div> -->
</body>
</html>
